name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "scripts/deploy-frontend.sh"
      - ".github/workflows/frontend-ci-cd.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Create Frontend Environment File
        run: |
          API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}"

          if [ -n "$API_BASE_URL" ] && [[ "$API_BASE_URL" != https://* ]]; then
            echo "VITE_API_BASE_URL must be HTTPS when deploying the frontend."
            exit 1
          fi

          if [ -n "$API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL=$API_BASE_URL" >> .env
          fi

      - name: Build Frontend
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::803871199972:role/GitHubActionsStartTechRole
          aws-region: us-east-1

      - name: Deploy Frontend
        run: |
          chmod +x scripts/deploy-frontend.sh
          ./scripts/deploy-frontend.sh \
            ${{ vars.FRONTEND_BUCKET_NAME }}
        working-directory: .
